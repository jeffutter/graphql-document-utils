[package]
name = "graphql-document-utils"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Jeffery Utter <jeff@jeffutter.com>"]
readme = "README.md"
description = "Utilities to process GraphQL query and schema documents"
license = "MIT"
repository = "https://github.com/jeffutter/graphql-document-utils"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap-stdin = "0.6.0"
graphql-normalize = { path = "graphql-normalize-lib" }
graphql-parser = "0.4.1"
petgraph = "0.8.2"
pretty_assertions = "1.4.1"
strsim = "0.11.1"
thiserror = "2.0.21"

[workspace]
members = [ "graphql-normalize-lib" ]

# Crates are versioned independently, so release one at a time:
#   cargo release -p graphql-document-utils <level>
[workspace.metadata.release]
allow-branch = ["main"]
pre-release-hook = ["cargo", "test", "--workspace", "--all-features"]

[package.metadata.release]
# Distributed as GitHub release binaries, not on crates.io.
publish = false
# The CD workflow only builds binaries for tags matching `[v]?X.Y.Z`.
tag-name = "v{{version}}"

[[bin]]
name = "graphql-document-utils"
path = "src/main.rs"

[dev-dependencies]
indoc = "2.0.6"
insta = "1.48.0"
serde_norway = "0.9.42"
tempfile = "3.27.0"

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1.1.5", features = ["pty", "fs"] }
